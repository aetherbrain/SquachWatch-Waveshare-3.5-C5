[platformio]
default_envs = cyd, cyd-ili9341, awok

[env]
platform = espressif32@6.5.0
board = esp32dev
framework = arduino
upload_speed = 921600
board_build.partitions = partitions_ota.csv
monitor_speed = 921600
extra_scripts = pre:extra_script.py

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    https://github.com/PaulStoffregen/XPT2046_Touchscreen.git
    h2zero/NimBLE-Arduino@^2.5.1

build_unflags =
    -DILI9341_DRIVER
    -DST7789_DRIVER
    -DST7796_DRIVER

nimble_flags_mesh =
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1

nimble_flags_cyd =
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL_DISABLED
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
    -DCONFIG_BT_NIMBLE_MAX_BONDS=1

[env:cyd]
monitor_speed = 2000000
build_flags =
    -DCYD=1
    -DSERIAL_BAUD=2000000
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/cyd_user_setup.h
    ${env.nimble_flags_cyd}
    -DSQUACH_MESH=1

[env:cyd-ili9341]
monitor_speed = 2000000
build_flags =
    -DCYD=1
    -DSERIAL_BAUD=2000000
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/cyd_ili9341_user_setup.h
    ${env.nimble_flags_cyd}
    -DSQUACH_MESH=1

[env:awok]
monitor_speed = 2000000
build_flags =
    -DAWOK=1
    -DSERIAL_BAUD=2000000
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/awok_user_setup.h
    ${env.nimble_flags_cyd}
    -DSQUACH_MESH=1

[env:waveshare-c5-35]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-c5-devkitc-1
framework = arduino
extra_scripts = pre:extra_script.py
board_build.partitions = partitions_ota_8mb.csv
monitor_speed = 115200
build_flags =
    -DSQW_WIFI_5G=1
    -DBOARD_WAVESHARE_C5_35=1
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/waveshare_c5_35_user_setup.h
    -DST7796_DRIVER=1
    -DTFT_WIDTH=320
    -DTFT_HEIGHT=480
    -DTFT_MISO=2
    -DTFT_MOSI=7
    -DTFT_SCLK=6
    -DTFT_CS=8
    -DTFT_DC=5
    -DTFT_RST=-1
    -DTFT_BL=-1
    -DSPI_FREQUENCY=40000000
    -DSPI_READ_FREQUENCY=20000000
    -DLOAD_GLCD=1
    -DLOAD_FONT2=1
    -DLOAD_FONT4=1
    -DLOAD_FONT6=1
    -DLOAD_FONT7=1
    -DLOAD_FONT8=1
    -DLOAD_GFXFF=1
    -DSMOOTH_FONT=1
    ${env.nimble_flags_cyd}
    -DSQUACH_MESH=1
lib_deps =
    ${env.lib_deps}
    lewisxhe/XPowersLib@^0.3.3

[env:nm-cyd-c5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = nm-cyd-c5
board_build.partitions = partitions_ota_16mb.csv
board_build.variants_dir = variants
monitor_speed = 115200
build_flags =
    -DCYD=1
    -DRLPHANTOM_R=1
    -DNM_CYD_C5=1
    -DSQW_C5_DMA_HZ=80000000
    -DSQW_WIFI_5G=1
    -DSERIAL_BAUD=115200
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/nmcydc5_user_setup.h
    ${env.nimble_flags_cyd}
    -DSQUACH_MESH=1

[env:marauder-v8]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = marauder-v8
board_build.partitions = partitions_ota_8mb.csv
board_build.variants_dir = variants
monitor_speed = 115200
build_flags =
    -DCYD=1
    -DRLPHANTOM_R=1
    -DNM_CYD_C5=1
    -DMARAUDER_V8=1
    -DSQW_C5_DMA_HZ=40000000
    -DSQW_C5_SPI_DIV=1
    -DSQW_WIFI_5G=1
    -DSERIAL_BAUD=115200
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_DIR/include/marauder_v8_user_setup.h
    ${env.nimble_flags_cyd}
    -DSQUACH_MESH=1

